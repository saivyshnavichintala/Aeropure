<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AeroPure - Data</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<aside class="sidebar">

    <div class="logo">
        ✈ AeroPure
    </div>

    <ul class="menu">

        <li class="menu-item">
            <a href="{{ url_for('home') }}">
                🏠 <span>Home</span>
            </a>
        </li>

        <li class="menu-item active">
            <a href="{{ url_for('data_page') }}">
                📊 <span>Data</span>
            </a>
        </li>

        <li class="menu-item">
            <a href="{{ url_for('eda_page') }}">
                📈 <span>EDA</span>
            </a>
        </li>

        <li class="menu-item">
            <a href="{{ url_for('preprocessing_page') }}">
                ⚙️ <span>Preprocessing</span>
            </a>
        </li>

        <li class="menu-item">
            <a href="{{ url_for('regression_page') }}">
                📉 <span>Regression</span>
            </a>
        </li>

        <li class="menu-item">
            <a href="{{ url_for('decision_tree_page') }}">
                🌳 <span>Decision Tree</span>
            </a>
        </li>

    </ul>

</aside>


<main class="main-content">

    <div class="page-header">

        <h1>
            Dataset
        </h1>

        <p>
            Air-quality and weather data
        </p>

    </div>


    <div class="info-row">

        <div class="info-box">

            <h3>Rows</h3>

            <p>
                {{ rows }}
            </p>

        </div>


        <div class="info-box">

            <h3>Columns</h3>

            <p>
                {{ columns }}
            </p>

        </div>

    </div>


    <section class="content-section">

        <h2>
            Dataset Preview
        </h2>

        <div class="table-container">

            {{ table | safe }}

        </div>

    </section>


</main>

</body>

</html>
